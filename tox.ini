[tox]
# One environment per supported Python version and Qt binding.
# PySide2 is not listed: it does not support Python 3.11+.
envlist =
    py{311,312,313,314}-{pyqt5,pyqt6,pyside6}
requires = tox>=4

[testenv]
package = wheel
deps =
    pytest
    pytest-qt
    pydantic
# Each environment installs exactly one Qt binding (via the matching extra)
# and selects it for both QtPy (QT_API) and pytest-qt (PYTEST_QT_API).
extras =
    pyqt5: pyqt5
    pyqt6: pyqt6
    pyside6: pyside6
setenv =
    pyqt5: QT_API = pyqt5
    pyqt5: PYTEST_QT_API = pyqt5
    pyqt6: QT_API = pyqt6
    pyqt6: PYTEST_QT_API = pyqt6
    pyside6: QT_API = pyside6
    pyside6: PYTEST_QT_API = pyside6
commands = pytest tests -q
