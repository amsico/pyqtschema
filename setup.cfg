[metadata]
name = pyqtschema
# Read the version from the dedicated module so setuptools can resolve it
# statically, without importing the package (which imports QtPy/QtWidgets and
# would fail in an isolated build environment without a Qt binding).
version = attr: pyqtschema.__version__.version
author = Amsico
author_email = amsico@eclipso.eu
description = Convert json-schema to QWidgets
long_description = file: README.md, changelog.md
long_description_content_type = text/markdown
url = https://github.com/amsico/pyqtschema
project_urls =
    Bug Tracker = https://github.com/amsico/pyqtschema/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    jsonschema
    qtpy

# Qt bindings are optional; qtpy picks whichever one is installed.
# Install a binding explicitly or with the matching extra, e.g.:
#   pip install pyqtschema[pyside6]
[options.extras_require]
pyqt5 = PyQt5
pyqt6 = PyQt6
pyside2 = PySide2
pyside6 = PySide6


[options.packages.find]
where = src
